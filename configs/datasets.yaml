# Dataset configuration for modernbert-hs pipeline
# Update paths to match your local data directory before running.

preprocessing:
  output_root: outputs/1_preprocessed
  test_size: 0.2
  random_state: 42

# Datasets used across the pipeline.
# Role of each dataset:
#   russian  — Part 2: raw corpus used as density reference (how close is a sample to Russian HS?)
#              Part 4: annotated set used for final evaluation only
#   toxigen  — Parts 2+3: embeddings generated, density computed, model fine-tuned
#   (future) — same as toxigen
datasets:
  toxigen:
    data_dir: data/raw/toxigen          # folder containing {group}.csv files
    groups:
      - asian
      - black
      - chinese
      - jewish
      - latino
      - lgbtq
      - mental_dis
      - mexican
      - middle_east
      - muslim
      - native_american
      - physical_dis
      - women

  russian:
    annotated_path: data/raw/russian/russ_annot_masked.csv
    full_corpus_path: data/raw/russian/completeDataset_inference.csv

# Datasets used for fine-tuning (Part 3).
# Russian is excluded — it is the density reference and final evaluation target.
train_datasets:
  - toxigen

embedding:
  output_root: outputs/2_embeddings
  models:
    - sentence-transformers/all-mpnet-base-v2
  batch_size: 32
  k_values: [5, 100, 1000]
  # pca_components: 128
  use_gpu: true

training:
  output_root: outputs/3_training
  models:
    - answerdotai/ModernBERT-base
  epochs: 3
  batch_size: 16
  learning_rate: 2e-5
  max_length: 128
  random_state: 42

evaluation:
  output_root: outputs/4_evaluation
